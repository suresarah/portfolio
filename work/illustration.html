  <script>
    // Each project is a small stack: click it to flip to the next piece.
    document.addEventListener('click', e => {
      const card = e.target.closest('.deck-card');
      if (!card) return;
      const imgs = [...card.querySelectorAll('img')];
      const i = imgs.findIndex(im => !im.hidden);
      const next = (i + 1) % imgs.length;
      imgs[i].hidden = true; imgs[next].hidden = false;
      const count = card.closest('.deck').querySelector('.deck-count');
      if (count) count.textContent = (next + 1) + ' / ' + imgs.length;
    });
  </script>
